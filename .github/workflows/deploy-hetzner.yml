name: Test, Build, Deploy to Hetzner

# Required repository secrets:
# - HETZNER_HOST: server hostname or IP address
# - HETZNER_USER: SSH user on the server
# - HETZNER_SSH_KEY: private SSH key with access to the server
# - HETZNER_PATH: absolute path to this repository checkout on the server
#
# Optional repository secrets:
# - HETZNER_PORT: SSH port, defaults to 22
# - HETZNER_KNOWN_HOSTS: pinned known_hosts entry; falls back to ssh-keyscan
# - HETZNER_RESTART_COMMAND: command run after pull/install/build, for example
#   "pm2 reload jsonExplorer" or "sudo systemctl restart jsonexplorer"

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --openssl-legacy-provider
  NODE_VERSION: "22"

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log build context
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          echo "Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          echo "Lockfiles present:"
          ls -1 package-lock.json yarn.lock 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  deploy:
    name: Pull, build, and restart on Hetzner
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name != 'pull_request'
    environment: production
    timeout-minutes: 30

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
      HETZNER_PATH: ${{ secrets.HETZNER_PATH }}
      HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
      HETZNER_RESTART_COMMAND: ${{ secrets.HETZNER_RESTART_COMMAND }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}

    steps:
      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for secret_name in HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY HETZNER_PATH; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required repository secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          echo "Deploy branch: ${DEPLOY_BRANCH}"
          echo "Deploy SHA: ${DEPLOY_SHA}"
          echo "Hetzner host configured: yes"
          echo "Hetzner path configured: yes"
          echo "Hetzner port: ${HETZNER_PORT:-22}"
          echo "Restart command configured: $([ -n "${HETZNER_RESTART_COMMAND:-}" ] && echo yes || echo no)"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${HETZNER_SSH_KEY}" | tr -d '\r' > ~/.ssh/hetzner_deploy_key
          chmod 600 ~/.ssh/hetzner_deploy_key

          if [ -n "${HETZNER_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${HETZNER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${HETZNER_PORT:-22}" -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts
          fi

      - name: Pull tested commit on Hetzner
        shell: bash
        run: |
          set -euo pipefail

          remote_env=$(
            printf 'APP_DIR=%q DEPLOY_BRANCH=%q DEPLOY_SHA=%q NODE_OPTIONS=%q RESTART_COMMAND=%q' \
              "${HETZNER_PATH}" \
              "${DEPLOY_BRANCH}" \
              "${DEPLOY_SHA}" \
              "${NODE_OPTIONS}" \
              "${HETZNER_RESTART_COMMAND:-}"
          )

          ssh \
            -i ~/.ssh/hetzner_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${HETZNER_PORT:-22}" \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "${remote_env} bash -s" <<'REMOTE'
          set -Eeuo pipefail

          echo "Server: $(hostname)"
          echo "User: $(whoami)"
          echo "App directory: ${APP_DIR}"
          echo "Branch: ${DEPLOY_BRANCH}"
          echo "Expected SHA: ${DEPLOY_SHA}"

          command -v git >/dev/null
          command -v node >/dev/null
          command -v npm >/dev/null

          cd "${APP_DIR}"

          echo "Remote HEAD before pull: $(git rev-parse --short HEAD)"
          echo "Remote working tree before pull:"
          git status --short

          git fetch --prune origin "+refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"

          if git show-ref --verify --quiet "refs/heads/${DEPLOY_BRANCH}"; then
            git checkout "${DEPLOY_BRANCH}"
          else
            git checkout -b "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"
          fi

          git pull --ff-only origin "${DEPLOY_BRANCH}"

          actual_sha="$(git rev-parse HEAD)"
          echo "Remote HEAD after pull: ${actual_sha}"

          if [ "${actual_sha}" != "${DEPLOY_SHA}" ]; then
            echo "Expected ${DEPLOY_SHA}, but server ended on ${actual_sha}"
            exit 1
          fi

          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

          npm ci
          npm run build

          if [ -n "${RESTART_COMMAND}" ]; then
            echo "Running restart command"
            bash -lc "${RESTART_COMMAND}"
          else
            echo "No HETZNER_RESTART_COMMAND configured; pull and build completed without restarting a process."
          fi
          REMOTE
